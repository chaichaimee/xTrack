summary = "xTrack"
description = """xTrack は、コンテキスト メニューに多彩なメディア管理機能を統合することで NVDA のアクセシビリティを強化します。音声や動画ファイルの変換、トリミング、分割、結合を、精確なフェード効果と共に行えます。MP3 の音量正規化、カスタム画像を使った音声の MP4 動画への変換、写真のサイズ変更、ファイル メタデータの取得が可能です。内蔵レコーダーは、高度なノイズ抑制機能と自動ダッキング制御を備え、システム音声とマイク入力をキャプチャし、スムーズでプロフェッショナルなワークフローの最適化を実現します。
ホットキー:
ALT+Windows+X : xTrack メニューを開く
Ctrl+Shift+SpaceBar: 録音の開始と一時停止
CTRL+Windows+Space: 録音の停止"""