summary = "إكس تراك"
description = """يقوم xTrack بتحسين إمكانية الوصول في NVDA من خلال دمج إدارة الوسائط المتعددة في قائمة السياق الخاصة بك. قم بتحويل الملفات الصوتية أو المرئية وقصها وتقسيمها ودمجها بسهولة مع تأثيرات تلاشي دقيقة. قم بتطبيع مستويات صوت MP3، وتحويل الصوت إلى مقاطع فيديو MP4 باستخدام صور مخصصة، وتغيير حجم الصور، جلب بيانات الملفات الوصفية. يلتقط المسجل المدمج الخاص به صوت النظام ومدخلات الميكروفون مع إلغاء متقدم للضوضاء وأدوات تحكم تلقائية في خفض الصوت لتحسين سير العمل بسلاسة وبشكل احترافي.
اختصارات لوحة المفاتيح:
ALT+Windows+X : فتح قائمة xTrack
CTRL+Shift+SpaceBar : Start and pause Recording
CTRL+Windows+SpaceBar: إيقاف التسجيل"""