summary = "xTrack"
description = """xTrack은(는) 다양한 미디어 관리 기능을 컨텍스트 메뉴에 통합하여 NVDA의 접근성을 향상시킵니다. 정밀한 페이드 효과를 사용하여 오디오 또는 비디오 파일을 손쉽게 변환, 자르기, 분할, 병합할 수 있습니다. MP3 볼륨 정규화, 사용자 정의 이미지를 사용한 오디오의 MP4 비디오 변환, 사진 크기 조정 및 파일 메타데이터 가져오기가 가능합니다. 내장된 녹음기는 고급 노이즈 억제 및 자동 더킹 제어 기능을 통해 시스템 오디오와 마이크 입력을 캡처하여 매끄럽고 전문적인 워크플로 최적화를 지원합니다.
단축키:
ALT+Windows+X : xTrack 메뉴 열기
CTRL+Shift+SpaceBar: 녹음 시작 및 일시정지
CTRL+Windows+SpaceBar : 녹음 중지"""