summary = "xTrack"
description = """xTrack meningkatkan aksesibilitas NVDA dengan mengintegrasikan manajemen media serbaguna ke dalam menu konteks Anda. Ubah, potong, pisahkan, dan gabungkan file audio atau video dengan mudah beserta efek fade yang presisi. Normalisasikan volume MP3, ubah audio menjadi video MP4 dengan gambar kustom, ubah ukuran foto, dan ambil metadata file. Perekam bawaannya menangkap audio sistem dan masukan mikrofon dengan penekanan derau tingkat lanjut serta kontrol auto-ducking untuk pengoptimalan alur kerja yang mulus dan profesional.
Tombol Pintas:
ALT+Windows+X : Buka Menu xTrack
CTRL+Shift+SpaceBar : Start and pause Recording
CTRL+Windows+Spasi : Hentikan Perekaman"""