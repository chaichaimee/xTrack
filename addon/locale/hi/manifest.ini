summary = "xTrack"
description = """एक्सट्रैक (xTrack) आपके कॉन्टेक्स्ट मेनू में बहुमुखी मीडिया प्रबंधन को एकीकृत करके एनवीडीए की सुलभता को बेहतर बनाता है। सटीक फ़ेड इफ़ेक्ट के साथ ऑडियो या वीडियो फ़ाइलों को आसानी से कंवर्ट, ट्रिम, स्प्लिट और मर्ज करें। MP3 वॉल्यूम को सामान्य करें, कस्टम इमेज के साथ ऑडियो को MP4 वीडियो में कंवर्ट करें, फ़ोटो का आकार बदलें और फ़ाइल मेटाडेटा प्राप्त करें। इसका अंतर्निहित रिकॉर्डर एक सहज और पेशेवर वर्कफ़्लो अनुकूलन के लिए उन्नत शोर दमन (नॉइज़ सप्रेशन) और स्वचालित डकिंग नियंत्रण के साथ सिस्टम ऑडियो और माइक्रोफ़ोन इनपुट को कैप्चर करता है।
हॉट कुंजियाँ:
ALT+Windows+X : एक्सट्रैक मेनू खोलें
CTRL+Shift+SpaceBar : रिकॉर्डिंग शुरू और रोकें
CTRL+Windows+SpaceBar : रिकॉर्ड बंद करें"""