summary = "xTrack"
description = """xTrack verbessert die Barrierefreiheit von NVDA, indem es eine vielseitige Medienverwaltung in Ihr Kontextmenü integriert. Konvertieren, schneiden, teilen und zusammenführen Sie Audio- oder Videodateien mühelos mit präzisen Überblendungseffekten. Normalisieren Sie MP3-Lautstärken, konvertieren Sie Audio in MP4-Videos mit benutzerdefinierten Bildern, passen Sie Bildgrößen an und rufen Sie Dateimetadaten ab. Der integrierte Rekorder nimmt Systemaudio und Mikrofoneingänge mit erweiterten Rauschunterdrückungs- und automatischen Absenkungssteuerungen für einen nahtlosen, professionellen Workflow auf.
Tastenkombinationen:
ALT+Windows+X : Open xTrack Menu
Strg+Umschalt+Leertaste: Aufnahme starten und anhalten
STRG+Windows+Leertaste: Aufzeichnung stoppen"""