name = xTrack
summary = "xTrack"
description = """xTrack enhances NVDA's accessibility by integrating versatile media management into your context menu. Effortlessly convert, trim, split, and merge audio or video files with precision fade effects. Normalize MP3 volumes, convert audio to MP4 videos with custom images, resize photos, and fetch file metadata. Its built-in recorder captures system audio and microphone input with advanced noise suppression and automatic ducking controls for seamless, professional workflow optimization.
Hot Keys:
ALT+Windows+X : Open xTrack Menu
CTRL+Shift+SpaceBar : Start and pause Recording
CTRL+Windows+SpaceBar : Stop Record"""
