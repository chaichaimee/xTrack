name = xTrack
summary = "xTrack"
description = """xTrack adds a File Explorer menu Alt+Windows+X to convert, trim, merge, split, normalize, enhance and resize audio, video and images. Its recorder captures system audio and microphone with optional noise reduction.


Hot Keys:
ALT+Windows+X : Open xTrack Menu
CTRL+Shift+SpaceBar : Start and pause Recording
CTRL+Windows+SpaceBar : Stop Record"""
